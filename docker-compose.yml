services:
  postgres:
    image: postgres:16-alpine
    container_name: commercepulse-postgres
    environment:
      POSTGRES_DB: commercepulse
      POSTGRES_USER: commercepulse
      POSTGRES_PASSWORD: commercepulse_local_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commercepulse -d commercepulse"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - commercepulse_pgdata:/var/lib/postgresql/data

volumes:
  commercepulse_pgdata:
