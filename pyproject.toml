[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commercepulse-europe"
version = "1.0.0"
description = "Recruiter-verifiable omnichannel growth, profitability, and operations analytics portfolio."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Portfolio Author" }]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<22",
  "pandera>=0.24,<0.27",
  "scipy>=1.14,<2",
  "statsmodels>=0.14,<0.15",
  "matplotlib>=3.9,<4",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "dbt-core>=1.9,<1.10",
  "dbt-postgres>=1.9,<1.10",
  "jupyter>=1.1,<2",
  "nbclient>=0.10,<0.11",
  "nbformat>=5.10,<6",
  "pytest>=8.3,<9",
  "ruff>=0.12,<0.13",
  "sqlfluff>=3.4,<4",
]

[project.scripts]
commercepulse = "commercepulse.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.sqlfluff.core]
dialect = "postgres"
templater = "jinja"
max_line_length = 100
exclude_rules = "LT05,ST05,ST06,ST07,RF04"

[tool.sqlfluff.templater.jinja]
apply_dbt_builtins = true
load_macros_from_path = "dbt/macros"
